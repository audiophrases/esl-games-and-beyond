<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Games, practice tools, and other useful resources for English learners.">
  <meta name="theme-color" content="#f4efe4">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>ESL Games and Beyond</title>
  <link rel="stylesheet" href="styles.css">
  <script src="auth.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#catalog">Skip to the activities</a>

  <header class="site-header">
    <h1 class="brand-heading">
      <a class="brand" href="./">
        <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M8 9h25c4 0 7 3 7 7v12c0 4-3 7-7 7H22l-9 7 2-7H8c-4 0-7-3-7-7V16c0-4 3-7 7-7Z"/>
          <path d="M13 22h4m5 0h4m5 0h4"/>
        </svg>
        <span>ESL Games <i>&amp; Beyond</i></span>
      </a>
    </h1>
  </header>

  <main>
    <section id="catalog" aria-label="Activities">
      <div id="grid" class="grid"></div>
      <p id="grid-note" class="grid-note" hidden></p>
    </section>
  </main>

  <footer>
    <button type="button" id="admin-link" class="admin-link">Admin</button>
  </footer>

  <dialog id="signin-dialog" aria-labelledby="signin-title">
    <h2 id="signin-title">Admin sign-in</h2>
    <p>Sign in with an authorised Google account to edit this catalog.</p>
    <div id="gsi-button"></div>
    <p id="auth-error" class="error" hidden></p>
    <button type="button" class="ghost" data-close-signin>Cancel</button>
  </dialog>

  <noscript><p class="noscript">This page needs JavaScript. You can still browse the projects at <a href="https://github.com/audiophrases">github.com/audiophrases</a>.</p></noscript>
</body>
</html>
